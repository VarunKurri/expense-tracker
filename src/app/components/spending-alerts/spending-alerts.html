@if (alerts().length > 0) {
  <div class="panel">
    <div class="panel-head">
      <div>
        <div class="panel-title">Worth a look</div>
        <div class="panel-sub-text">
          {{ alerts().length === 1 ? 'One charge looks' : alerts().length + ' charges look' }} different from usual
        </div>
      </div>
      @if (alerts().length > 4) {
        <button class="panel-link" (click)="showAllAlerts.set(!showAllAlerts())">
          {{ showAllAlerts() ? 'Fewer' : 'All ' + alerts().length }} →
        </button>
      }
    </div>

    @for (a of shownAlerts(); track a.key) {
      <div class="alert-row">
        <button type="button" class="activity-row" (click)="openTx.emit(a.tx)" [title]="alertText(a)">
          <span class="activity-icon" aria-hidden="true">
            <app-icon [name]="kindIcon[a.kind]" [size]="16" [stroke]="1.7" />
          </span>
          <span class="activity-main">
            <span class="activity-title">{{ a.tx.merchant || 'Untitled' }}</span>
            <span class="activity-meta">{{ alertMeta(a) }}</span>
          </span>
          <span class="activity-amount">−{{ money(a.tx.amount) }}</span>
        </button>
        <button type="button" class="alert-dismiss" (click)="dismissAlert(a)" aria-label="Dismiss" title="Dismiss">
          <app-icon name="close" [size]="13" />
        </button>
      </div>
    }
  </div>
}
