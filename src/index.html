<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trackr</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trackr" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!--
      Three type voices, matching Origin's stack:
        Newsreader  — display serif (their Lyon Display), weight 300 + italic
        Inter       — UI sans (their Suisse Intl; Inter is their own fallback)
        Roboto Mono — labels, data and buttons
      Loaded here rather than from styles.scss so the request is not queued
      behind the stylesheet.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@300..800&family=Roboto+Mono:wght@400;500;600&display=swap"
    />

    <!--
      Set the theme before first paint. ThemeService also does this in an
      effect(), but that runs after Angular boots — without this the page
      flashes the default theme first.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
          if (t === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0A0A');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
